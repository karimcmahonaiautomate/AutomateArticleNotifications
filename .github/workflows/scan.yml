name: Scan for published articles and notify sources

on:
  schedule:
    # Runs every 30 minutes. GitHub may delay this slightly during
    # busy periods — that's normal for scheduled Actions.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Lets you trigger a run manually from the Actions tab, useful
    # for testing.
    inputs:
      dry_run:
        description: "Dry run (log matches, don't send or update sheet)"
        required: false
        default: "false"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Debug secret presence (temporary)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "RESULT: secret is EMPTY or not reaching this job"
          else
            echo "RESULT: secret has length ${#GOOGLE_SERVICE_ACCOUNT_JSON} characters"
            echo "First character: ${GOOGLE_SERVICE_ACCOUNT_JSON:0:1}"
          fi

      - name: Run scanner
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          MAIN_EMAIL: ${{ secrets.MAIN_EMAIL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python scripts/scan_and_notify.py
